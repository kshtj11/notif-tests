<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Notifications Panel</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; }
  body {
    background: #000;
    display: flex; justify-content: center; align-items: center;
    touch-action: none; user-select: none;
    font-family: 'Sora', system-ui, sans-serif;
  }

  #frame {
    position: relative; width: 540px; height: 620px;
    background: #373737; overflow: hidden;
  }

  /* Home */
  #home {
    position: absolute; inset: 0; z-index: 1;
    display: flex; flex-direction: column; align-items: center;
    padding-top: 80px; gap: 24px;
  }
  .widget { border-radius: 16px; background: rgba(255,255,255,0.06); }
  .widget-a { width: 320px; height: 100px; }
  .widget-b { width: 240px; height: 64px; }
  .app-dock {
    position: absolute; bottom: 36px; left: 50%; transform: translateX(-50%);
    display: flex; gap: 20px;
  }
  .app-icon {
    width: 56px; height: 56px; border-radius: 14px;
    background: rgba(255,255,255,0.08);
  }

  /* Dim */
  #recents-bg {
    position: absolute; inset: 0; z-index: 8;
    background: #000; opacity: 0;
    transition: opacity 0.26s cubic-bezier(0.22,1,0.36,1);
    pointer-events: none;
  }

  /* Panel */
  #panels {
    position: absolute; inset: 0; z-index: 11; overflow: hidden;
    transform: translateY(100%);
    transition: transform 0.26s cubic-bezier(0.22,1,0.36,1);
    background: #0D0D0D;
  }
  #panels.open { transform: translateY(0); }

  .notif-list { padding: 48px 0 0; display: flex; flex-direction: column; }

  /* Row */
  .notif-row {
    position: relative; height: 96px; margin-bottom: 12px;
    flex-shrink: 0; overflow: hidden;
  }
  .notif-row.dismissing {
    height: 0; margin-bottom: 0; opacity: 0; overflow: hidden;
    transition: height 350ms cubic-bezier(0.25,1,0.5,1),
                margin-bottom 350ms cubic-bezier(0.25,1,0.5,1),
                opacity 250ms ease-out;
  }

  /* Buttons — anchored right, grow leftward */
  .notif-actions {
    position: absolute; top: 0; right: 10px; height: 96px;
    display: flex; align-items: stretch; gap: 6px;
  }
  .notif-btn {
    height: 96px; border-radius: 12px;
    display: flex; align-items: center; justify-content: center;
    overflow: hidden; white-space: nowrap; min-width: 0;
    width: 0; opacity: 0;
    font-weight: 600; font-size: 16px; color: #fff; cursor: pointer;
  }
  .btn-options { background: #303030; }
  .btn-clear   { background: #202020; }

  /* Card */
  .notif-card {
    position: absolute; left: 10px; top: 0;
    width: 520px; height: 96px;
    background: #303030; border-radius: 12px;
    display: flex; align-items: center;
    padding: 0 10px 0 20px; gap: 16px;
    z-index: 2; will-change: transform; cursor: grab;
  }

  /* Icon */
  .notif-icon-wrap { position: relative; width: 52px; height: 52px; flex-shrink: 0; }
  .notif-icon {
    width: 52px; height: 52px; background: #00D757; border-radius: 12px;
    display: flex; align-items: center; justify-content: center;
  }
  .notif-icon svg { width: 28px; height: 28px; }
  .notif-badge {
    position: absolute; top: -4px; right: -10px;
    min-width: 24px; height: 24px;
    background: #FF3745; border-radius: 40px;
    display: flex; align-items: center; justify-content: center;
    font-size: 14px; font-weight: 600; color: #fff; padding: 0 6px;
  }

  /* Normal text content */
  .notif-text { display: flex; flex-direction: column; gap: 8px; flex: 1; min-width: 0; }
  .notif-header { display: flex; justify-content: space-between; align-items: baseline; }
  .notif-name { font-weight: 600; font-size: 16px; color: #fff; }
  .notif-time { font-weight: 400; font-size: 15px; color: #6A6A6A; }
  .notif-subtitle { font-weight: 400; font-size: 14px; color: #6A6A6A; }

  /* Expanded (long-press) content */
  .notif-expanded {
    display: none; align-items: center; gap: 14px;
    flex: 1; min-width: 0;
  }
  .notif-card.expanded .notif-text { display: none; }
  .notif-card.expanded .notif-badge { display: none; }
  .notif-card.expanded .notif-expanded { display: flex; }
  .notif-card.expanded { background: #3a3a3a; cursor: default; }

  .exp-app-name { font-weight: 600; font-size: 15px; color: #fff; flex: 1; }
  .exp-btn {
    width: 38px; height: 38px; border-radius: 10px;
    background: rgba(255,255,255,0.08);
    display: flex; align-items: center; justify-content: center;
    cursor: pointer; flex-shrink: 0;
    transition: background 150ms ease;
  }
  .exp-btn:active { background: rgba(255,255,255,0.18); }
  .exp-btn svg { width: 20px; height: 20px; }

  /* Options menu */
  .menu-backdrop {
    position: absolute; inset: 0; z-index: 19;
    display: none;
  }
  .menu-backdrop.active { display: block; }
  .options-menu {
    position: absolute;
    background: #252525;
    border-radius: 14px;
    padding: 4px 0;
    min-width: 250px;
    transform-origin: top right;
    transform: scale(0);
    opacity: 0;
    z-index: 20;
    pointer-events: none;
    transition: transform 220ms cubic-bezier(0.22, 1, 0.36, 1),
                opacity 150ms ease;
    box-shadow: 0 8px 32px rgba(0,0,0,0.45);
  }
  .options-menu.open {
    transform: scale(1);
    opacity: 1;
    pointer-events: auto;
  }
  .options-menu-item {
    padding: 14px 20px;
    font-size: 15px;
    font-weight: 400;
    color: #fff;
    cursor: pointer;
    transition: background 80ms ease;
  }
  .options-menu-item:active { background: rgba(255,255,255,0.08); }
  .options-menu-item + .options-menu-item {
    border-top: 1px solid rgba(255,255,255,0.06);
  }

  /* Swipe zone */
  #swipe-zone {
    position: absolute; bottom: 0; left: 50%; transform: translateX(-50%);
    width: 120px; height: 16px; z-index: 31;
    display: flex; justify-content: center; align-items: center;
  }
  #swipe-zone::after {
    content: ''; width: 48px; height: 4px; border-radius: 2px;
    background: rgba(255,255,255,0.18);
  }
</style>
</head>
<body>

<div id="frame">

              <svg viewBox="0 0 24 24" fill="none"><path d="M18 8A6 6 0 006 8c0 7-3 9-3 9h18s-3-2-3-9z" stroke="#fff" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M13.73 21a2 2 0 01-3.46 0" stroke="#fff" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>

<script>
/* ── Panel slide-up / dismiss ── */
const frame  = document.getElementById('frame');
const panels = document.getElementById('panels');
const dim    = document.getElementById('recents-bg');
const zone   = document.getElementById('swipe-zone');

let tracking = false, startY = 0, startT = 0, lastY = 0, lastT = 0;
let mode = '', justOpened = false;

zone.addEventListener('pointerdown', e => {
  if (panels.classList.contains('open')) return;
  tracking = true; mode = 'open';
  startY = lastY = e.clientY; startT = lastT = performance.now();
  frame.setPointerCapture(e.pointerId);
  panels.style.transition = 'none';
});
panels.addEventListener('pointerdown', e => {
  if (!panels.classList.contains('open')) return;
  if (e.target.closest('.notif-row') || e.target.closest('.options-menu') || e.target.closest('.menu-backdrop')) return;
  tracking = true; mode = 'dismiss';
  startY = lastY = e.clientY; startT = lastT = performance.now();
  frame.setPointerCapture(e.pointerId);
  panels.style.transition = 'none';
});
frame.addEventListener('pointermove', e => {
  if (!tracking) return;
  lastY = e.clientY; lastT = performance.now();
  if (mode === 'open') {
    const up = startY - e.clientY;
    if (up > 24) {
      const f = Math.min(up / 620, 1);
      panels.style.transform = `translateY(${100 - f * 100}%)`;
      dim.style.opacity = f * 0.75;
    }
  } else if (mode === 'dismiss') {
    const dy = Math.max(0, e.clientY - startY);
    panels.style.transform = `translateY(${dy}px)`;
    dim.style.opacity = Math.max(0, 0.75 * (1 - dy / 620));
  }
});
frame.addEventListener('pointerup', e => {
  if (!tracking) return;
  tracking = false;
  panels.style.transition = '';
  if (mode === 'open') {
    const up = startY - e.clientY;
    const vel = (lastT - startT) > 0 ? up / (lastT - startT) : 0;
    if (up > 40 || vel > 0.4) {
      panels.classList.add('open');
      panels.style.transform = ''; dim.style.opacity = 0.75;
      justOpened = true; requestAnimationFrame(() => { justOpened = false; });
    } else { panels.style.transform = ''; dim.style.opacity = 0; }
  } else if (mode === 'dismiss') {
    if (e.clientY - startY > 90) {
      hideMenu();
      panels.classList.remove('open');
      panels.style.transform = ''; dim.style.opacity = 0;
    } else { panels.style.transform = ''; dim.style.opacity = 0.75; }
  }
  mode = '';
});
frame.addEventListener('click', e => {
  if (!panels.classList.contains('open') || justOpened) return;
  if (panels.contains(e.target) || zone.contains(e.target)) return;
  panels.style.transition = '';
  hideMenu();
  panels.classList.remove('open');
  panels.style.transform = ''; dim.style.opacity = 0;
});

/* ── Options menu ── */
const optionsMenu = document.createElement('div');
optionsMenu.className = 'options-menu';
optionsMenu.innerHTML = ['Remind in 15 Min','Mute for 1 Hour','Mute for Today','Turn Off Notifications','App settings']
  .map(t => `<div class="options-menu-item">${t}</div>`).join('');
panels.appendChild(optionsMenu);

const menuBg = document.createElement('div');
menuBg.className = 'menu-backdrop';
panels.appendChild(menuBg);

let menuRow = null;

function showMenu(btnEl, row) {
  const br = btnEl.getBoundingClientRect();
  const pr = panels.getBoundingClientRect();
  optionsMenu.style.top = (br.top - pr.top) + 'px';
  optionsMenu.style.right = (pr.right - br.right) + 'px';
  requestAnimationFrame(() => {
    optionsMenu.classList.add('open');
    menuBg.classList.add('active');
  });
  menuRow = row;
}

function hideMenu() {
  if (!optionsMenu.classList.contains('open')) return;
  optionsMenu.classList.remove('open');
  menuBg.classList.remove('active');
  if (menuRow) {
    menuRow._close();
    menuRow = null;
  }
}

menuBg.addEventListener('pointerdown', e => {
  e.stopPropagation();
  hideMenu();
});
optionsMenu.querySelectorAll('.options-menu-item').forEach(item => {
  item.addEventListener('click', e => {
    e.stopPropagation();
    hideMenu();
  });
});

/* ── Swipe-to-dismiss + long-press ── */
const CARD_W = 520;
const T_SNAP = CARD_W * 0.28;
const T_DISMISS_L = CARD_W * 0.85;
const T_DISMISS_R = CARD_W * 0.35;
const SNAP_REVEAL = 200;
const FLICK_V_L = 1.2;
const FLICK_V_R = 0.6;
const BTN_GAP = 6;
const CARD_PAD = 8;
const CLEAR_ONSET = 240;
const SPR = 'transform 350ms cubic-bezier(0.25,1,0.5,1)';
const SPRA = 'all 350ms cubic-bezier(0.25,1,0.5,1)';
const LP_HOLD = 500;
const LP_VISUAL = 60;

let openRow = null;
let expandedRow = null;

function btnWidths(rev) {
  if (rev <= 0) return [0, 0];
  const usable = Math.max(0, rev - CARD_PAD);
  if (usable <= 0) return [0, 0];
  if (rev < CLEAR_ONSET) return [usable, 0];
  const extra = rev - CLEAR_ONSET;
  const t = Math.min(extra / 250, 1);
  const optMax = CLEAR_ONSET - CARD_PAD;
  const opt = optMax - t * (optMax - 113);
  const clr = Math.max(0, usable - opt - BTN_GAP);
  return [Math.round(opt), Math.round(clr)];
}

function initSwipe(row) {
  const card = row.querySelector('.notif-card');
  const bOpt = row.querySelector('.btn-options');
  const bClr = row.querySelector('.btn-clear');
  let drag = false, sx, st, baseX = 0;
  let pressTimer = null, lpTimer = null, isHolding = false;
  let expanded = false, justExpanded = false;

  function apply(rev) {
    const [ow, cw] = btnWidths(rev);
    bOpt.style.width = ow + 'px';
    bClr.style.width = cw + 'px';
    bOpt.style.opacity = Math.min(rev / 60, 1);
    bClr.style.opacity = cw > 10 ? Math.min(cw / 40, 1) : 0;
    bClr.style.display = cw > 0 ? '' : 'none';
  }
  function spring() {
    card.style.transition = SPR;
    bOpt.style.transition = SPRA; bClr.style.transition = SPRA;
  }
  function instant() {
    card.style.transition = 'none';
    bOpt.style.transition = 'none'; bClr.style.transition = 'none';
  }
  function doOpen() {
    card.style.transform = `translateX(-${SNAP_REVEAL}px)`;
    apply(SNAP_REVEAL); baseX = -SNAP_REVEAL; openRow = row;
  }
  function doClose() {
    card.style.transform = 'translateX(0)';
    apply(0); baseX = 0;
    if (openRow === row) openRow = null;
  }
  function doDismissLeft() {
    const F = 'all 180ms cubic-bezier(0.25,1,0.5,1)';
    card.style.transition = F; bOpt.style.transition = F; bClr.style.transition = F;
    card.style.transform = `translateX(-${CARD_W + 20}px)`;
    bClr.style.display = '';
    bClr.style.width = `${CARD_W}px`; bClr.style.opacity = '1';
    bOpt.style.width = '0px'; bOpt.style.opacity = '0';
    setTimeout(() => row.classList.add('dismissing'), 180);
    setTimeout(() => row.remove(), 550);
    if (openRow === row) openRow = null;
  }
  function doDismissRight() {
    const F = 'all 180ms cubic-bezier(0.25,1,0.5,1)';
    card.style.transition = F; bOpt.style.transition = F; bClr.style.transition = F;
    card.style.transform = `translateX(${CARD_W + 20}px)`;
    apply(0);
    setTimeout(() => row.classList.add('dismissing'), 180);
    setTimeout(() => row.remove(), 550);
    if (openRow === row) openRow = null;
  }
  function expand() {
    expanded = true;
    expandedRow = row;
    card.classList.add('expanded');
    apply(0); baseX = 0;
    if (openRow === row) openRow = null;
  }
  function collapse() {
    expanded = false;
    if (expandedRow === row) expandedRow = null;
    card.classList.remove('expanded');
    card.style.transition = SPR;
    card.style.transform = 'translateX(0)';
  }
  function cancelHold() {
    if (pressTimer) { clearTimeout(pressTimer); pressTimer = null; }
    if (lpTimer) { clearTimeout(lpTimer); lpTimer = null; }
    if (isHolding) {
      isHolding = false;
      card.style.transition = 'transform 200ms cubic-bezier(0.25,1,0.5,1)';
      card.style.transform = 'translateX(0)';
    }
  }

  row._close = () => { spring(); doClose(); };
  row._collapse = () => { if (expanded) collapse(); };

  card.addEventListener('pointerdown', e => {
    if (e.target.closest('.exp-btn')) return;

    if (expanded) {
      e.stopPropagation();
      return;
    }

    hideMenu();
    if (openRow && openRow !== row) { openRow._close(); openRow = null; }
    if (expandedRow && expandedRow !== row) { expandedRow._collapse(); expandedRow = null; }

    drag = true; sx = e.clientX; st = performance.now();
    card.setPointerCapture(e.pointerId);
    instant();

    pressTimer = setTimeout(() => {
      pressTimer = null;
      isHolding = true;
      card.style.transition = 'transform 250ms cubic-bezier(0.25,1,0.5,1)';
      card.style.transform = 'translateX(0) scale(0.96)';
    }, LP_VISUAL);

    lpTimer = setTimeout(() => {
      lpTimer = null;
      if (!isHolding) return;
      isHolding = false; drag = false; justExpanded = true;
      card.style.transition = 'transform 200ms cubic-bezier(0.22,1,0.36,1)';
      card.style.transform = 'translateX(0) scale(1.04)';
      setTimeout(() => {
        card.style.transition = 'transform 180ms cubic-bezier(0.25,1,0.5,1)';
        card.style.transform = 'translateX(0) scale(1)';
        setTimeout(() => expand(), 80);
      }, 180);
    }, LP_HOLD);

    e.stopPropagation();
  });

  card.addEventListener('pointermove', e => {
    if (!drag) return;

    if ((pressTimer || lpTimer || isHolding) && Math.abs(e.clientX - sx) > 8) {
      cancelHold();
      card.style.transition = 'none';
    }

    if (!isHolding) {
      let dx = Math.max(-CARD_W, Math.min(CARD_W, e.clientX - sx + baseX));
      card.style.transform = `translateX(${dx}px)`;
      if (dx < 0) apply(Math.abs(dx));
      else apply(0);
    }
    e.stopPropagation();
  });

  card.addEventListener('pointerup', e => {
    if (justExpanded) {
      justExpanded = false;
      e.stopPropagation(); return;
    }

    if (expanded) {
      if (!e.target.closest('.exp-btn')) collapse();
      e.stopPropagation(); return;
    }

    if (isHolding || pressTimer || lpTimer) {
      cancelHold();
      drag = false;
      card.style.transition = 'transform 250ms cubic-bezier(0.25,1,0.5,1)';
      card.style.transform = 'translateX(0)';
      e.stopPropagation(); return;
    }

    if (!drag) { e.stopPropagation(); return; }
    drag = false;
    const rawDx = e.clientX - sx;
    const dx = Math.max(-CARD_W, Math.min(CARD_W, rawDx + baseX));
    const abs = Math.abs(dx);
    const dt = Math.max(1, performance.now() - st);
    const tap = Math.abs(rawDx) < 5;
    spring();
    if (dx > 0) {
      const vel = rawDx / dt;
      if (abs >= T_DISMISS_R || vel > FLICK_V_R) doDismissRight();
      else doClose();
    } else if (tap && baseX < 0) doClose();
    else if (abs >= T_DISMISS_L || (sx - e.clientX) / dt > FLICK_V_L) doDismissLeft();
    else if (abs >= T_SNAP) doOpen();
    else doClose();
    e.stopPropagation();
  });

  bClr.addEventListener('click', e => { e.stopPropagation(); spring(); doDismissLeft(); });
  bOpt.addEventListener('click', e => {
    e.stopPropagation();
    showMenu(bOpt, row);
  });
}

document.querySelectorAll('.notif-row').forEach(initSwipe);

panels.addEventListener('click', e => {
  if (e.target.closest('.options-menu') || e.target.closest('.menu-backdrop')) return;
  if (expandedRow && !e.target.closest('.notif-card')) {
    expandedRow._collapse(); expandedRow = null;
  }
  if (openRow && !e.target.closest('.notif-row')) {
    openRow._close(); openRow = null;
  }
});
</script>
</body>
</html>
